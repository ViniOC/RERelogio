[env:relogio]
platform = espressif8266
board = esp12e
framework = arduino
board_build.flash_mode = dio
board_build.ldscript = eagle.flash.4m2m.ld
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@7.2.1
; Pinos da tela (relato da comunidade GeekMagic SmallTV; confirmados na F1)
build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=-1
    -D TFT_DC=0
    -D TFT_RST=2
    -D TFT_SPI_MODE=SPI_MODE3
    -D SPI_FREQUENCY=40000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT8=1
    -D SMOOTH_FONT=1
    -D PINO_LUZ=5

; Atualização pelo Wi-Fi: uvx platformio run -e ota -t upload
[env:ota]
extends = env:relogio
upload_protocol = espota
upload_port = relogio.local
